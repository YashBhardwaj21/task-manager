name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Create .env.test
        run: |
          echo "PORT=5000" > .env.test
          echo "DATABASE_URL=postgresql://testuser:testpass@localhost:5433/testdb" >> .env.test
          echo "DIRECT_URL=postgresql://testuser:testpass@localhost:5433/testdb" >> .env.test
          echo "JWT_SECRET=test_secret_123" >> .env.test
          echo "JWT_REFRESH_SECRET=test_refresh_123" >> .env.test
          echo "JWT_EXPIRES_IN=15m" >> .env.test
          echo "JWT_REFRESH_EXPIRES_IN=7d" >> .env.test

      - name: Start Test Database
        run: npm run test:db:start

      - name: Wait for Database
        run: sleep 5

      - name: Run Prisma Migrations
        run: npm run test:prepare

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Stop Test Database
        if: always()
        run: npm run test:db:stop

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Project
        run: npm run build
